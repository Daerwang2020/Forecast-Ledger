[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ts-repro"
version = "0.1.0"
description = "Forecast Ledger: adapter-first, manifest-backed fair evaluation for time-series forecasting."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Forecast Ledger Contributors"}]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "build>=1.2"]

[project.scripts]
tsr = "ts_repro.cli:main"

[tool.setuptools.packages.find]
include = ["ts_repro*"]

[tool.setuptools.package-data]
ts_repro = ["catalog/models/*.yaml", "catalog/datasets/*.yaml", "viewer/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
