name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run unit and contract tests
        run: python -m pytest

  package:
    name: Build and install distribution
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Build sdist and wheel
        run: python -m pip install build && python -m build
      - name: Install wheel in a clean target
        run: |
          python -m pip install --target /tmp/forecast-ledger-install dist/*.whl
          PYTHONPATH=/tmp/forecast-ledger-install python -m ts_repro --help
          test -f /tmp/forecast-ledger-install/ts_repro/catalog/models/dlinear-official-template.yaml
