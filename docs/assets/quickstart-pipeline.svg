<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">One complete Forecast Ledger run</title>
  <desc id="desc">Four stages show how a forecasting question becomes a sealed, inspectable evidence card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity=".10"/></filter>
    <style>
      .title{font:700 28px ui-sans-serif,system-ui,sans-serif;fill:#0f172a}.sub{font:400 15px ui-sans-serif,system-ui,sans-serif;fill:#475569}
      .num{font:700 13px ui-monospace,SFMono-Regular,monospace;fill:#fff}.head{font:700 17px ui-sans-serif,system-ui,sans-serif;fill:#0f172a}
      .body{font:400 14px ui-sans-serif,system-ui,sans-serif;fill:#334155}.mono{font:600 12px ui-monospace,SFMono-Regular,monospace;fill:#334155}
      .arrow{stroke:#94a3b8;stroke-width:3;fill:none;stroke-linecap:round}.strip{font:600 15px ui-sans-serif,system-ui,sans-serif;fill:#312e81}
    </style>
  </defs>
  <rect width="1200" height="500" rx="24" fill="url(#bg)"/>
  <text x="54" y="54" class="title">One complete run, from question to evidence</text>
  <text x="54" y="82" class="sub">A five-minute path that preserves the experimental seam and leaves an auditable artifact.</text>

  <g filter="url(#shadow)">
    <rect x="45" y="118" width="250" height="230" rx="18" fill="#ecfeff" stroke="#99f6e4"/>
    <circle cx="78" cy="151" r="18" fill="#0f766e"/><text x="73" y="156" class="num">01</text>
    <text x="108" y="157" class="head">Create the question</text>
    <text x="68" y="197" class="body">Start with ordinary local files:</text>
    <text x="68" y="225" class="mono">toy.csv + dataset.yaml</text>
    <text x="68" y="258" class="body">Declare train / validation / test</text>
    <text x="68" y="282" class="body">before any model code runs.</text>
  </g>
  <path d="M300 233h44" class="arrow"/><path d="m337 224 10 9-10 9" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="350" y="118" width="250" height="230" rx="18" fill="#fff7ed" stroke="#fed7aa"/>
    <circle cx="383" cy="151" r="18" fill="#c2410c"/><text x="378" y="156" class="num">02</text>
    <text x="413" y="157" class="head">Freeze protocol</text>
    <text x="373" y="199" class="mono">context = 24</text>
    <text x="373" y="224" class="mono">horizon = 6</text>
    <text x="373" y="249" class="mono">normalise = train_only</text>
    <text x="373" y="286" class="body">The question is fixed before</text>
    <text x="373" y="310" class="body">the official checkout is called.</text>
  </g>
  <path d="M605 233h44" class="arrow"/><path d="m642 224 10 9-10 9" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="655" y="118" width="250" height="230" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
    <circle cx="688" cy="151" r="18" fill="#1d4ed8"/><text x="683" y="156" class="num">03</text>
    <text x="718" y="157" class="head">Call the seam</text>
    <text x="678" y="199" class="mono">reference_linear</text>
    <text x="678" y="226" class="mono">fit → predict → shape gate</text>
    <text x="678" y="268" class="body">The bridge records revision,</text>
    <text x="678" y="292" class="body">command, and runtime facts.</text>
  </g>
  <path d="M910 233h44" class="arrow"/><path d="m947 224 10 9-10 9" class="arrow"/>

  <g filter="url(#shadow)">
    <rect x="960" y="118" width="195" height="230" rx="18" fill="#f5f3ff" stroke="#ddd6fe"/>
    <circle cx="993" cy="151" r="18" fill="#6d28d9"/><text x="988" y="156" class="num">04</text>
    <text x="1023" y="157" class="head">Seal &amp; inspect</text>
    <text x="983" y="199" class="mono">predictions.npz</text>
    <text x="983" y="224" class="mono">metrics.json</text>
    <text x="983" y="249" class="mono">manifest.json</text>
    <text x="983" y="292" class="body">Open viewer/index.html</text>
    <text x="983" y="316" class="body">and verify before citing.</text>
  </g>

  <rect x="45" y="386" width="1110" height="70" rx="16" fill="#e0e7ff" stroke="#a5b4fc"/>
  <circle cx="79" cy="421" r="15" fill="#4338ca"/><path d="M72 421h14M79 414v14" stroke="#fff" stroke-width="2"/>
  <text x="108" y="417" class="strip">The proof object: a sealed run card that another researcher can verify before citing.</text>
  <text x="108" y="440" class="sub">Same protocol. Same seam. Ordinary files. No leaderboard required.</text>
</svg>
